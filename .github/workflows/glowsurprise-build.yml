name: Validate GlowSurprise prototype
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/glowsurprise-christmas-prototype, feature/glowsurprise-cinematic-mobile-v2]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck application
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build production bundle
        run: npm run build
